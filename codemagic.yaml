workflows:
  ios-release:
    name: Guardroom24 iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.octopusiot.example
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest

    scripts:
      # 0️⃣ Pulizia cache e DerivedData iniziale
      - name: Clean DerivedData
        script: rm -rf ~/Library/Developer/Xcode/DerivedData/*

      # 1️⃣ Installa dipendenze npm
      - name: Install npm dependencies
        script: npm install

      # 2️⃣ Sincronizza Capacitor per iOS
      - name: Capacitor sync
        script: npx cap sync ios

      # 3️⃣ Rimuovi VisionOS da WebRTC Package.swift
      - name: Remove VisionOS from WebRTC Package.swift
        script: |
          PACKAGE_PATH="ios/App/CapApp-SPM/Package.swift"
          if [ -f "$PACKAGE_PATH" ]; then
            echo "Rimuovo target VisionOS dal Package.swift..."
            sed -i '' '/\.visionOS/d' "$PACKAGE_PATH"
          fi

      # 4️⃣ Risolvi Swift Packages
      - name: Resolve Swift packages
        script: xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT"

      # 5️⃣ Debug progetto (opzionale)
      - name: Debug - verify project state
        script: |
          echo "=== Package.swift ==="
          cat ios/App/CapApp-SPM/Package.swift
          echo "=== WebRTCExport.swift ==="
          cat ios/App/CapApp-SPM/Sources/CapApp-SPM/WebRTCExport.swift || echo "MISSING"

      # 6️⃣ Configura firma codice
      - name: Set up code signing
        script: xcode-project use-profiles

      # 7️⃣ Build IPA
      - name: Build iOS IPA
        script: |
          set -e
          echo "Building $XCODE_PROJECT scheme $XCODE_SCHEME"

          xcodebuild clean \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "$PWD/build/App.xcarchive"

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log