workflows:
  ios-release:
    name: Guardroom24 iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.octopusiot.example
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest

    scripts:
      # 1️⃣ Installa dipendenze npm
      - name: Install npm dependencies
        script: npm install

      # 2️⃣ Sincronizza Capacitor per iOS
      - name: Capacitor sync
        script: npx cap sync ios

      # 3️⃣ Aggiunge WebRTC via Swift Package Manager
      - name: Add WebRTC to CapApp-SPM
        script: |
          python3 - << 'PYEOF'
          import re
          path = 'ios/App/CapApp-SPM/Package.swift'
          c = open(path).read()
          if 'webrtc-sdk' not in c:
              c = c.replace(
                  '    dependencies: [',
                  '    dependencies: [\n        .package(url: "https://github.com/webrtc-sdk/Specs.git", exact: "144.7559.01"),',
                  1
              )
              first = c.index('.product(name: "Capacitor"')
              c = c[:first] + '.product(name: "WebRTC", package: "Specs"),\n                ' + c[first:]
              open(path, 'w').write(c)
              print('WebRTC aggiunto a Package.swift')
          else:
              print('WebRTC gia presente in Package.swift')
          PYEOF

          cat > ios/App/CapApp-SPM/Sources/CapApp-SPM/WebRTCExport.swift << 'SWIFTEOF'
          @_exported import WebRTC
          SWIFTEOF

      # 4️⃣ Debug progetto
      - name: Debug - verify project state
        script: |
          echo "=== Package.swift ==="
          cat ios/App/CapApp-SPM/Package.swift
          echo "=== WebRTCExport.swift ==="
          cat ios/App/CapApp-SPM/Sources/CapApp-SPM/WebRTCExport.swift || echo "MISSING"
          echo "=== CameraMatrixWebRTCViewController in pbxproj ==="
          grep -n "CameraMatrixWebRTC" ios/App/App.xcodeproj/project.pbxproj || echo "NOT FOUND in pbxproj"
          echo "=== xcodebuild showBuildSettings (raw) ==="
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings 2>&1 | tail -30 || true

      # 5️⃣ Configura firma codice
      - name: Set up code signing
        script: xcode-project use-profiles

      # 6️⃣ Pulizia DerivedData
      - name: Clean DerivedData
        script: rm -rf ~/Library/Developer/Xcode/DerivedData/*

      # 8️⃣ Build IPA
      - name: Build iOS IPA
        script: |
          set -e
          echo "Building $XCODE_PROJECT scheme $XCODE_SCHEME"

          xcodebuild clean \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "$PWD/build/App.xcarchive"

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log