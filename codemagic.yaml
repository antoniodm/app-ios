workflows:
  ios-release:
    name: Guardroom24 iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.octopusiot.example
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest

    scripts:
      # Pulizia DerivedData
      - name: Clean DerivedData
        script: rm -rf ~/Library/Developer/Xcode/DerivedData/*

      # 1️⃣ Install npm dependencies
      - name: Install npm dependencies
        script: npm install

      # 2️⃣ Sync Capacitor
      - name: Capacitor sync
        script: npx cap sync ios

      # 3️⃣ Remove VisionOS target if presente
      - name: Remove VisionOS from Package.swift
        script: |
          PACKAGE_PATH="ios/App/CapApp-SPM/Package.swift"
          if [ -f "$PACKAGE_PATH" ]; then
            sed -i '' '/\.visionOS/d' "$PACKAGE_PATH"
          fi

      # 4️⃣ Resolve Swift packages (necessario anche se usi xcframework)
      - name: Resolve Swift packages
        script: xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT"

      # 5️⃣ Debug info (opzionale)
      - name: Debug project
        script: |
          echo "Listing Frameworks..."
          ls ios/App/Frameworks
          echo "Package.swift:"
          cat ios/App/CapApp-SPM/Package.swift || echo "MISSING"

      # 6️⃣ Setup code signing
      - name: Set up code signing
        script: xcode-project use-profiles

      # 7️⃣ Build IPA
      - name: Build iOS IPA
        script: |
          set -e
          echo "Building $XCODE_PROJECT scheme $XCODE_SCHEME"

          # Clean
          xcodebuild clean \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release

          # Archive con flag per WebRTC.xcframework
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "$PWD/build/App.xcarchive" \
            -configuration Release \
            -quiet \
            -allowProvisioningUpdates \
            -destination 'generic/platform=iOS' \
            -framework "ios/App/Frameworks/WebRTC.xcframework"

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log